<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>短链管理系统</title>
  <meta name="description" content="基于 Cloudflare Workers + D1 + KV 的短链管理系统，支持多域名、项目组权限、审核与访问统计。" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="短链管理系统" />
  <meta property="og:description" content="部署在全球边缘网络的短链管理系统：多域名、项目组权限、审核流程与访问统计开箱即用。" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="mask-icon" href="/favicon.svg" color="#2563eb" />
  <!-- 人机验证脚本按需加载，提前建立连接可减少登录页等待 -->
  <link rel="dns-prefetch" href="https://challenges.cloudflare.com" />
  <!-- 首屏应用主题：默认跟随系统，避免亮暗切换闪屏 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('sl_theme_pref');
        var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {
        /* ignore */
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
