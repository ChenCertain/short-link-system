<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>短链管理系统</title>
  <meta name="description" content="基于 Cloudflare Workers + D1 + KV 的短链管理系统，支持多域名、项目组权限、审核与访问统计。" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#2563eb" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="短链管理系统" />
  <meta property="og:description" content="部署在全球边缘网络的短链管理系统：多域名、项目组权限、审核流程与访问统计开箱即用。" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="mask-icon" href="/favicon.svg" color="#2563eb" />
  <!-- 首屏应用主题，避免暗色模式闪白 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('sl_theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {
        /* ignore */
      }
    })();
  </script>
  <!-- Cloudflare Turnstile -->
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
