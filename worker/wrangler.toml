# ==========================================================
# 短链系统 - Cloudflare Workers 配置
# 部署前请把下面带 REPLACE_ 的占位符替换为你自己的资源 ID / 密钥
# 敏感信息（JWT_SECRET、TURNSTILE_SECRET_KEY、SMTP_PASS）建议在
# Cloudflare Dashboard → Workers → Settings → Variables and Secrets
# 中配置为 Secret，而不是写在这里
# ==========================================================

name = "short-link-system"
compatibility_date = "2024-09-23"
main = "src/index.ts"
# 注意：数据库迁移目录在下方 [[d1_databases]] 中通过 migrations_dir 指定

# ============ D1 数据库 ============
# 创建命令: npx wrangler d1 create short-link-db
[[d1_databases]]
binding = "DB"
database_name = "short-link-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "../migrations"

# ============ KV 命名空间 ============
# 创建命令: npx wrangler kv namespace create SHORT_LINK_KV
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# ============ 非敏感环境变量 ============
[vars]
# Turnstile Site Key：可留空，留空时前端不显示人机验证，后端也跳过校验
TURNSTILE_SITE_KEY = ""
# SMTP 邮件服务：用于发送登录验证码与审核通知，支持任意 SSL 465 端口的 SMTP
# 下面默认值是飞书邮箱的公开地址，可换成你自己的服务商（如 smtp.qq.com / 465）
SMTP_HOST = "smtp.feishu.cn"
SMTP_PORT = "465"
# 发信账号与发件人地址：请填成你自己的邮箱，留空则无法发送邮件（仅本机调试可用）
# 对应的密码请配置为 Worker Secret（SMTP_PASS），不要写在这个文件里
SMTP_USER = ""
SMTP_FROM = ""
# 本实例 Worker 的访问域名（不含协议），仅用于「域名管理」里的 DNS 指引
# 可留空，留空时使用默认提示；部署后拿到 workers.dev 域名再填也可以
PAGES_DOMAIN = ""
# 本 Worker 的 workers.dev 域名（不含协议），「域名管理」会自动展示为 CNAME 目标
# 留空时会自动取当前请求的 workers.dev 域名
WORKER_HOST = ""

# ============ 前端静态资源 ============
# 前端构建产物目录（npm run build 会先生成 frontend/dist）
[assets]
directory = "../frontend/dist"
binding = "ASSETS"
# 请求先经过 Worker，便于为带指纹的构建产物下发 immutable 强缓存头
# （wrangler 3.x 仅支持布尔值；静态资源仍由 ASSETS 绑定直接返回）
run_worker_first = true
