# ==========================================================
# 短链系统 - Cloudflare Workers 配置
# 部署前请把下面带 REPLACE_ 的占位符替换为你自己的资源 ID / 密钥
# 敏感信息（JWT_SECRET、TURNSTILE_SECRET_KEY、SMTP_PASS）建议在
# Cloudflare Dashboard → Workers → Settings → Variables and Secrets
# 中配置为 Secret，而不是写在这里
# ==========================================================

name = "short-link-system"
compatibility_date = "2024-09-23"
main = "src/index.ts"
# 部署时保留控制台已配置的明文变量（plain_text / json），不用本文件覆盖或删除它们。
# 运行时变量统一在 Cloudflare「变量和密钥」中维护；本文件不声明 [vars]。
keep_vars = true
# 注意：数据库迁移目录在下方 [[d1_databases]] 中通过 migrations_dir 指定

# ============ D1 数据库 ============
# 创建命令: npx wrangler d1 create short-link-db
[[d1_databases]]
binding = "DB"
database_name = "short-link-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "../migrations"

# ============ KV 命名空间 ============
# 创建命令: npx wrangler kv namespace create SHORT_LINK_KV
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# ============ 运行时环境变量 ============
# 这里刻意不声明任何 [vars]。
#
# 原因：`wrangler deploy` 会用本文件的 [vars] 整体替换线上的变量表，
# 若在此处写空值，每次部署都会把线上已配置的同名变量清空。
#
# 所有运行时变量请在 Cloudflare 控制台的
# 「Worker → 设置 → 变量和密钥（Variables and Secrets）」中配置：
#   TURNSTILE_SITE_KEY / SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_FROM
#   PAGES_DOMAIN / WORKER_HOST
# 敏感项（JWT_SECRET / SMTP_PASS / TURNSTILE_SECRET_KEY）务必选「密钥」类型。
#
# 本地开发：在 worker/.dev.vars 中配置同名变量（该文件已被 .gitignore 忽略）。
#
# 构建期必需的资源 ID（database_id / id 见上方）由 scripts/gen-wrangler.mjs
# 从构建变量注入，不要写死在本文件。

# ============ 前端静态资源 ============
# 前端构建产物目录（npm run build 会先生成 frontend/dist）
[assets]
directory = "../frontend/dist"
binding = "ASSETS"
# 请求先经过 Worker，便于为带指纹的构建产物下发 immutable 强缓存头
# （wrangler 3.x 仅支持布尔值；静态资源仍由 ASSETS 绑定直接返回）
run_worker_first = true
